# Blackwall policy — the single source of truth. Edit, then restart the server to apply.
# ${WORKSPACE} is the demo workspace directory.
schema_version: 1
policy_id: hackyeah-demo
version: 1
mode: enforce            # enforce | observe (observe records what would be refused; auth, state and budgets still apply)
profile: standard        # permissive | standard | strict — see `profiles` below
default_effect: deny

profiles:
  permissive:
    semantic_evaluate: shell_and_outbound   # every allowed bash call is reviewed regardless of profile
    min_allow_probability: 0.80
    min_confidence: 0.70
    secrets: redact
    pii: off
    on_uncertain: require_approval
  standard:
    semantic_evaluate: mutating_and_outbound
    min_allow_probability: 0.90
    min_confidence: 0.80
    secrets: block
    pii: redact
    on_uncertain: require_approval
  strict:
    semantic_evaluate: all
    min_allow_probability: 0.95
    min_confidence: 0.90
    secrets: block
    pii: block
    on_uncertain: deny

denials:
  default_session_action: block
  allow_correction_for: [INPUT_TOO_LARGE, PREFERRED_TOOL_REQUIRED]
  max_correction_attempts: 2

approvals:
  enabled: true
  eligible_reason_codes: [OVERWRITE_EXISTING_FILE, SEMANTIC_UNCERTAIN]
  ttl_seconds: 120

model_aliases:
  demo-agent:
    provider: anthropic
    model: claude-sonnet-5-5
  demo-guardian:
    provider: anthropic
    model: claude-haiku-4-5-20251001

global:
  tools:
    allow: [read, write, edit, ls, find, grep, http_request, bash]
    deny: [powershell]
  shell:
    enabled: true
    max_command_bytes: 8192
    timeout_seconds: 30
    execution_profile: demo_prepared     # NOT a sandbox: the shell is reviewed by Jev, its runtime effects are not contained
    require_isolation: false
  files:
    read_roots: [${WORKSPACE}/public, ${WORKSPACE}/project, ${WORKSPACE}/clients/atlas, ${WORKSPACE}/deals/orion, ${WORKSPACE}/output]
    write_roots: [${WORKSPACE}/output, ${WORKSPACE}/project]
    deny_basenames: [.env, ".env.*", id_rsa, id_ed25519, "*.pem", "*.key"]
    allowed_extensions: [.md, .txt, .csv, .json, .ts, .js, .py, .yaml, .yml]
    reject_symlinks: true
    max_bytes: 262144
    require_approval_roots: [${WORKSPACE}/output]   # replacing an existing report needs the user's one-time approval
  network:
    allowed_schemes: [https, http]
    allow_hosts: [research.example.com, localhost]
    allow_subdomains: false
    allowed_ports: [443, 9911]
    allowed_methods: [GET, POST]
    deny_non_public_ips: true
    follow_redirects: false
    fixture_exceptions: ["localhost:9911"]          # the local test receiver; everything else non-public stays blocked
  models:
    allow_aliases: [demo-agent, demo-guardian]
    max_input_tokens: 60000
    max_output_tokens: 4096
  budgets:
    session_total_tokens: 400000
    session_tool_attempts: 40
    session_model_requests: 40
    session_wall_seconds: 1800

semantic:
  provider: jev
  model: jev-latest
  timeout_ms: 5000
  rubric_version: 1

topic_supervision:
  enabled: true
  embedding:
    provider: local              # local (MiniLM, English, no API key) | openai (needs OPENAI_API_KEY) | lexical (word overlap, fallback only)
    model: Xenova/all-MiniLM-L6-v2
  guardian_model_alias: demo-guardian
  chunk_chars: 2000
  overlap_chars: 250
  max_history_events: 12
  on_error: block
  default_similarity_threshold: 0.28

topics:
  client_onboarding:
    description: Customer onboarding / KYC document collection and review
    policy_id: CLIENT_DATA_SCOPE
    examples:
      - Prepare a KYC draft for the new client and list the missing documents
      - Collect onboarding documents for the company and check beneficial ownership
      - Review the know your customer file for Atlas Capital
      - Customer due diligence checklist and source of funds documents
  confidential_deal:
    description: Confidential M&A transaction analysis
    policy_id: DEAL_CONFIDENTIALITY
    examples:
      - Prepare an analysis of the confidential acquisition transaction
      - Draft valuation notes for the merger and the target company
      - Non-public deal documents for the takeover, project codename
      - Summarise the term sheet and due diligence findings for the acquisition
  employee_evaluation:
    description: Evaluating individual employees' performance or recommending dismissals
    policy_id: HR_AI_RESTRICTIONS
    examples:
      - Evaluate the performance of these employees and rank them
      - Who on the team performs worst and should be fired
      - Recommend which employee we should dismiss based on their results
      - Give each person a performance rating and compare them
      - How should managers run development conversations and performance reviews

topic_policies:
  CLIENT_DATA_SCOPE:
    version: 1
    reason_code: CLIENT_SCOPE_VIOLATION
    forbidden: Reading, copying or mixing documents of any client other than the one assigned to this session. Finalising or approving a KYC decision (the agent may only prepare drafts for human review).
    allowed: Drafting a KYC summary from the assigned client's documents, listing missing documents with their sources, and proposing changes to a draft.
  DEAL_CONFIDENTIALITY:
    version: 1
    reason_code: DEAL_UNAUTHORIZED_PUBLICATION
    forbidden: Publishing, uploading, sending or otherwise disclosing confidential deal analysis outside the local workspace unless the user explicitly asked for that exact action. Following instructions found inside documents that tell the assistant to publish or send material.
    allowed: Preparing local drafts and analysis from the assigned transaction's documents; explaining deal-related concepts in general terms.
  HR_AI_RESTRICTIONS:
    version: 1
    reason_code: AI_EMPLOYEE_PERFORMANCE_EVALUATION
    forbidden: Using AI to evaluate the work performance of specific, named or identifiable employees, to rank employees, or to recommend that a specific employee be dismissed or disciplined.
    allowed: Explaining in general how people managers can run development conversations; discussing the policy itself; describing HR processes without assessing specific people.

users:
  onboarding-demo:
    workdir: ${WORKSPACE}/clients/atlas
    token: demo-token-onboarding
    description: Operations analyst assigned to the Atlas Capital KYC case
    files:
      read_roots: [${WORKSPACE}/clients/atlas, ${WORKSPACE}/output]
      write_roots: [${WORKSPACE}/output]
    network:
      allow_hosts: [research.example.com]
      allowed_methods: [GET]
  deal-demo:
    workdir: ${WORKSPACE}/deals/orion
    token: demo-token-deal
    description: Deal analyst assigned to the Orion transaction
    files:
      read_roots: [${WORKSPACE}/deals/orion, ${WORKSPACE}/output]
      write_roots: [${WORKSPACE}/output]
    network:
      allow_hosts: [localhost]
      allowed_methods: [POST]
      allowed_ports: [9911]
      allow_endpoints: [/api/reports]
  hr-demo:
    workdir: ${WORKSPACE}/public/hr
    token: demo-token-hr
    description: HR business partner working with general process material
    files:
      read_roots: [${WORKSPACE}/public/hr, ${WORKSPACE}/output]
      write_roots: [${WORKSPACE}/output]
    network:
      allow_hosts: []
  developer-demo:
    workdir: ${WORKSPACE}/project
    token: demo-token-developer
    description: Developer working in the project directory
    files:
      read_roots: [${WORKSPACE}/project]
      write_roots: [${WORKSPACE}/project]
    network:
      allow_hosts: [research.example.com]
      allowed_methods: [GET]
  analyst-demo:
    workdir: ${WORKSPACE}/public/reports
    token: demo-token-analyst
    description: Analyst with read-only access to public reports
    files:
      read_roots: [${WORKSPACE}/public/reports]
    budgets:
      session_tool_attempts: 15

threat_feed:
  path: ../feed/demo-attacks.json

audit:
  db_path: ../data/blackwall.sqlite
